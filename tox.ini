

# flake8 config removed - now using ruff

[pytest]
norecursedirs = .ctl .tox .venv data gen

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312

[tox]
envlist = py{310,311,312}-django{4,5}
isolated_build = True

[tox:.package]
# note tox will use the same python version as under what tox is installed to package
# so unless this is python 3 you can require a given python version for the packaging
# environment via the basepython key
basepython = python3


[testenv]
extras = dev 
deps =
  uv
  django4: django>=4.2,<5
  django5: django>=5.0,<6

commands =
    uv sync --extra dev
    uv run pytest tests/ --ds=project.settings --cov={toxinidir}/src --cov-report=term-missing --cov-report=xml